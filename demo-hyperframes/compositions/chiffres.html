  </style>
  <div id="root" data-composition-id="chiffres" data-width="1920" data-height="1080">
    <div id="ch-stage">
      <div id="ch-p1" class="clip" data-start="0" data-duration="2.05" data-track-index="1" data-layout-allow-overflow>
        <div id="ch-num">0</div>
        <div id="ch-label"><span class="ch-lw">IMAGES,</span><br /><span class="ch-lw">UNE</span> <span class="ch-lw">PAR</span> <span class="ch-lw">UNE.</span></div>
      </div>

      <div id="ch-p2" class="clip" data-start="2" data-duration="4" data-track-index="1">
        <div id="ch-head"><span class="ch-hw">1 800</span> <span class="ch-hw">IMAGES,</span><br /><span class="ch-hw">SCÈNE</span> <span class="ch-hw">PAR</span> <span class="ch-hw">SCÈNE.</span></div>
        <div id="ch-chart">
          <div id="ch-base"></div>
          <div class="ch-bar" id="ch-b0"></div>
          <div class="ch-bar" id="ch-b1"></div>
          <div class="ch-bar ch-here" id="ch-b2"></div>
          <div class="ch-bar" id="ch-b3"></div>
          <div class="ch-bar" id="ch-b4"></div>
          <div class="ch-val" id="ch-v0">0</div>
          <div class="ch-val" id="ch-v1">0</div>
          <div class="ch-val" id="ch-v2">0</div>

          <div class="ch-name" id="ch-n2">Chiffres</div>

          <div class="ch-name" id="ch-n4">Fin</div>
        </div>

  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const fmt = (n) => {
        const s = String(Math.round(n));
        return s.length > 3 ? s.slice(0, s.length - 3) + " " + s.slice(-3) : s;
      };

      // the hero count: every frame of this film
      const num = document.getElementById("ch-num");
      const c = { v: 0 };
      tl.fromTo(
        c,
        { v: 0 },
        {
          v: 1800,
          duration: 1.35,
          ease: "power3.out",
          onUpdate: function () {
            num.textContent = fmt(c.v);
          },
        },
        0.1,
      );
      tl.fromTo("#ch-num", { scale: 0.86, transformOrigin: "0% 100%" }, { scale: 1, duration: 1.4, ease: "expo.out" }, 0.05);
      document.querySelectorAll(".ch-lw").forEach(function (w, i) {
        tl.fromTo(w, { color: "#bdb6aa" }, { color: "#121212", duration: 0.12, ease: "none" }, 0.55 + i * 0.09);
      });
      // carry the count up into the heading
      tl.to("#ch-num", { scale: 0.13, x: 4, y: -40, filter: "blur(4px)", opacity: 0, duration: 0.3, ease: "power3.in" }, 1.75);
      tl.to("#ch-label", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 1.7);

      document.querySelectorAll(".ch-hw").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, 2.0 + i * 0.067);
      });

      // frames per scene at 60 fps: 4 s, 6 s, 6 s, 8 s, 6 s
      const vals = [240, 360, 360, 480, 360];
      const MAXH = 520;
      const X0 = 620,
        GAP = 245;
      tl.fromTo("#ch-base", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 2.15);
      vals.forEach(function (v, i) {
        const x = X0 + i * GAP;
        const h = (v / 480) * MAXH;
        const bar = document.getElementById("ch-b" + i);
        const val = document.getElementById("ch-v" + i);
        const name = document.getElementById("ch-n" + i);
        bar.style.left = x + "px";
        bar.style.height = h + "px";
        val.style.left = x + "px";
        val.style.top = 1080 - 210 - h - 104 + "px";
        name.style.left = x + "px";
        const t0 = 2.4 + i * 0.42;
        tl.fromTo(bar, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, t0);
        tl.fromTo(val, { y: h * 0.6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, t0);
        const cv = { v: 0 };
        tl.fromTo(
          cv,
          { v: 0 },
          {
            v: v,
            duration: 0.45,
            ease: "power3.out",
            onUpdate: function () {
              val.textContent = fmt(cv.v);
            },
          },
          t0,
        );
        tl.fromTo(name, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, t0 + 0.05);
      });

      // whip out to the next world
      tl.to("#ch-stage", { x: -1500, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 5.7);

      window.__timelines["chiffres"] = tl;
    })();
  </script>
