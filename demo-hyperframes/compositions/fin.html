    (function () {
      const tl = gsap.timeline({ paused: true });

      // the plate copies sit exactly under the ink lines

        const src = document.querySelector(id);

      // à prix coûtant: ink prints, the cream plate lands off register on the beat

      window.__timelines["fin"] = tl;
