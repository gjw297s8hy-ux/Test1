<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #ph-ground {
      position: absolute;
      inset: 0;
      background: var(--color-lime);
    }
    .ph-word {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    .ph-line {
      position: absolute;
      left: 110px;
      top: 50%;
      font-family: var(--font-display), "Archivo Black", sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.8;
      white-space: nowrap;
      color: var(--color-ink);
    }
    #ph-w2 .ph-line {
      color: var(--color-cream);
    }
    #ph-w3 .ph-line {
      color: var(--color-ink);
    }
    #ph-dep {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #ph-dep-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #ph-plate-b {
      color: var(--color-cream);
    }
    #ph-plate-a {
      color: var(--color-lime);
    }
    .ph-l {
      display: inline-block;
    }
    #ph-base {
      display: inline-block;
      width: 0;
      height: 0;
    }
    #ph-flood {
      position: absolute;
      inset: 0;
      background: var(--color-ink);
    }
  </style>
  <div id="root" data-composition-id="phrase" data-width="1920" data-height="1080">
    <div id="ph-ground"></div>

    <div id="ph-w1" class="ph-word clip" data-start="0" data-duration="0.5" data-track-index="1">
      <div class="ph-line" id="ph-w1-t">VOS</div>
    </div>
    <div id="ph-w2" class="ph-word clip" data-start="0.5" data-duration="0.5" data-track-index="1">
      <div class="ph-line" id="ph-w2-t">VIDÉOS</div>
    </div>
    <div id="ph-w3" class="ph-word clip" data-start="1" data-duration="0.5" data-track-index="1">
      <div class="ph-line" id="ph-w3-t">POUR VOS</div>
    </div>

    <div id="ph-dep" class="clip" data-start="1.5" data-duration="2.5" data-track-index="1" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="ph-dep-inner">
        <div class="ph-line" id="ph-plate-b"><span class="ph-l">B</span><span class="ph-l">U</span><span class="ph-l">S</span><span class="ph-l">I</span><span class="ph-l">N</span><span class="ph-l">E</span><span class="ph-l">S</span><span class="ph-l">S</span></div>
        <div class="ph-line" id="ph-plate-a"><span class="ph-l" id="ph-b">B</span><span class="ph-l">U</span><span class="ph-l">S</span><span class="ph-l">I</span><span class="ph-l">N</span><span class="ph-l">E</span><span class="ph-l">S</span><span class="ph-l">S</span><span id="ph-base"></span></div>
      </div>
    </div>

    <div id="ph-flood-wrap" class="clip" data-start="3.9" data-duration="0.1" data-track-index="2">
      <div id="ph-flood"></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const LIME = "#C8F43A",
        CREAM = "#F2EEE6",
        INK = "#111111";

      function fit(el, maxW, maxFs) {
        el.style.fontSize = "100px";
        const w = el.getBoundingClientRect().width;
        const fs = Math.min(maxFs, (100 * maxW) / w);
        el.style.fontSize = fs + "px";
        // vertical centre on the cap height (Archivo Black caps ~0.72 em)
        el.style.marginTop = -fs * 0.4 + "px";
        return fs;
      }

      function build() {
        fit(document.getElementById("ph-w1-t"), 1500, 700);
        fit(document.getElementById("ph-w2-t"), 1700, 560);
        fit(document.getElementById("ph-w3-t"), 1700, 560);
        const fsA = fit(document.getElementById("ph-plate-a"), 1700, 560);
        fit(document.getElementById("ph-plate-b"), 1700, 560);

        // the upper bowl of the B is the door to the next world: find its counter on a canvas
        const c = document.createElement("canvas");
        c.width = Math.ceil(fsA * 1.2);
        c.height = Math.ceil(fsA * 1.5);
        const g = c.getContext("2d");
        g.font = fsA + "px 'Archivo Black'";
        g.fillStyle = "#000";
        g.fillText("B", 0, fsA * 1.2);
        const px = g.getImageData(0, 0, c.width, c.height).data;
        const ink = (x, y) => px[(y * c.width + x) * 4 + 3] > 128;
        let top = -1,
          bot = -1;
        for (let y = 0; y < c.height; y++) {
          let any = false;
          for (let x = 0; x < c.width; x++) if (ink(x, y)) { any = true; break; }
          if (any) { if (top < 0) top = y; bot = y; }
        }
        const row = Math.round(top + 0.27 * (bot - top));
        let x = 0;
        while (x < c.width && !ink(x, row)) x++;
        while (x < c.width && ink(x, row)) x++;
        const c0 = x;
        while (x < c.width && !ink(x, row)) x++;
        const cx = (c0 + x) / 2;
        // centre the counter vertically too
        const ix = Math.round(cx);
        let yt = row,
          yb = row;
        while (yt > 0 && !ink(ix, yt - 1)) yt--;
        while (yb < c.height - 1 && !ink(ix, yb + 1)) yb++;
        const fromBase = fsA * 1.2 - (yt + yb) / 2;
        const inner = document.getElementById("ph-dep-inner").getBoundingClientRect();
        const b = document.getElementById("ph-b").getBoundingClientRect();
        const base = document.getElementById("ph-base").getBoundingClientRect();
        const ocx = b.left - inner.left + cx;
        const ocy = base.top - inner.top - fromBase;

        // ground: one ink per beat
        tl.set("#ph-ground", { backgroundColor: LIME }, 0);
        tl.set("#ph-ground", { backgroundColor: INK }, 0.5);
        tl.set("#ph-ground", { backgroundColor: CREAM }, 1.0);
        tl.set("#ph-ground", { backgroundColor: INK }, 1.5);

        // FAIS-MOI: already there at frame 0, settles
        tl.fromTo("#ph-w1-t", { scale: 1.06, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.45, ease: "expo.out" }, 0);
        // UNE VIDÉO: the whole line blurs in
        tl.fromTo("#ph-w2-t", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power4.out" }, 0.5);
        // QUI: punch-in
        tl.fromTo("#ph-w3-t", { scale: 1.35, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.3, ease: "expo.out" }, 1.0);

        // BUSINESS: plate A prints letter by letter, then plate B lands off register
        const la = document.querySelectorAll("#ph-plate-a .ph-l");
        const lb = document.querySelectorAll("#ph-plate-b .ph-l");
        la.forEach(function (l, i) {
          tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.001 }, 1.5 + i * 0.05);
        });
        tl.fromTo(lb, { opacity: 0 }, { opacity: 1, duration: 0.001 }, 2.0);
        tl.fromTo("#ph-plate-b", { x: 0, y: 0 }, { x: 12, y: 10, duration: 0.001 }, 2.0);

        // dive into the O
        gsap.set("#ph-dep-inner", { transformOrigin: ocx + "px " + ocy + "px" });
        tl.fromTo(
          "#ph-dep-inner",
          { x: 0, y: 0 },
          { x: 960 - ocx, y: 540 - ocy, duration: 0.55, ease: "power2.inOut" },
          3.2,
        );
        tl.fromTo("#ph-dep-inner", { scale: 1 }, { scale: 70, duration: 0.75, ease: "power3.in" }, 3.25);
        // lift the off-register plate so the counter is clean ink
        tl.to("#ph-plate-b", { opacity: 0, duration: 0.12, ease: "none" }, 3.15);
        tl.fromTo(
          "#ph-dep-inner",
          { filter: "blur(0px)" },
          { keyframes: [{ filter: "blur(0px)", duration: 0 }, { filter: "blur(5px)", duration: 0.35 }, { filter: "blur(0px)", duration: 0.3 }], ease: "none" },
          3.25,
        );

        window.__timelines["phrase"] = tl;
      }

      document.fonts.ready.then(function () {
        Promise.all([
          document.fonts.load("100px 'Archivo Black'"),
        ]).then(build, build);
      });
    })();
  </script>
</template>
