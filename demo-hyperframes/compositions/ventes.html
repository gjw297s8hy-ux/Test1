<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-cream);
    }
    #vt-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #vt-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    .vt-t {
      position: absolute;
      left: 110px;
      font-family: var(--font-display), "Archivo Black", sans-serif;
      font-size: 124px;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--color-ink);
    }
    #vt-t1 {
      top: 96px;
    }
    #vt-t2 {
      top: 222px;
    }
    .vt-w {
      display: inline-block;
    }
  </style>
  <div id="root" data-composition-id="ventes" data-width="1920" data-height="1080">
    <div id="vt-stage">
      <canvas id="vt-canvas" width="1920" height="1080"></canvas>
      <div id="vt-title" class="clip" data-start="1.1" data-duration="4.5" data-track-index="1">
        <div class="vt-t" id="vt-t1"><span class="vt-w">VOS</span> <span class="vt-w">VENTES</span></div>
        <div class="vt-t" id="vt-t2"><span class="vt-w">GRIMPENT.</span></div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, u) => a + (b - a) * u;
      const inOut2 = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
      const expoOut = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
      const backOut = (u) => {
        const c1 = 1.15,
          c3 = c1 + 1;
        return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
      };
      const in3 = (u) => u * u * u;

      const canvas = document.getElementById("vt-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.82;
      renderer.physicallyCorrectLights = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf2eee6).convertSRGBToLinear();
      const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 600);

      // a photo studio: warm grey room with three softboxes, baked into an environment map
      try {
        const env = new THREE.Scene();
        const room = new THREE.Mesh(new THREE.BoxGeometry(80, 50, 80), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.52, 0.48), side: THREE.BackSide }));
        env.add(room);
        function softbox(w, h, x, y, z, k) {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k * 0.96), side: THREE.DoubleSide }));
          m.position.set(x, y, z);
          m.lookAt(0, 0, 0);
          env.add(m);
        }
        softbox(26, 16, -22, 20, 22, 6); // key, upper left front
        softbox(6, 34, 34, 8, 6, 5); // strip, right
        softbox(30, 30, 0, 24.5, 0, 2.5); // overhead
        softbox(40, 6, 0, 2, -38, 2.5); // back rim
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(env, 0.035).texture;
      } catch (e) {}

      // seamless cove: floor that curves up into the back wall
      (function () {
        const prof = [];
        const R = 26;
        for (let i = 0; i <= 20; i++) prof.push([0, 90 - i * 4.5]);
        for (let i = 1; i <= 24; i++) {
          const a = (i / 24) * (Math.PI / 2);
          prof.push([R - R * Math.cos(a), -0 - R * Math.sin(a)]);
        }
        for (let i = 1; i <= 10; i++) prof.push([R + i * 12, -R]);
        const pos = [],
          idx = [];
        const X = [-260, 260];
        prof.forEach(function (p) {
          pos.push(X[0], p[0], p[1] - 0, X[1], p[0], p[1] - 0);
        });
        for (let j = 0; j < prof.length - 1; j++) {
          const a = j * 2,
            b = a + 1,
            c = a + 2,
            d = a + 3;
          idx.push(a, c, b, b, c, d);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xf2eee6).convertSRGBToLinear(), roughness: 0.62, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.55 });
        const cove = new THREE.Mesh(geo, mat);
        cove.position.z = -8;
        cove.receiveShadow = true;
        scene.add(cove);
      })();

      // lights: warm key with a soft shadow, cool fill from the sky
      const key = new THREE.DirectionalLight(0xfff3e2, 2.4);
      key.position.set(-30, 46, 34);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -45;
      key.shadow.camera.right = 45;
      key.shadow.camera.top = 45;
      key.shadow.camera.bottom = -45;
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 200;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      key.target.position.set(4, 0, 0);
      scene.add(key, key.target);
      scene.add(new THREE.HemisphereLight(0xeef2ff, 0xd9cbb0, 0.35));

      // the bars: lacquered lime, rounded edges, rising out of the floor
      const HEIGHTS = [2.4, 3.6, 5.2, 7.4, 10.2, 14];
      const X0 = -9,
        GAP = 4.8,
        W = 3.4;
      const barMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0xc8f43a).convertSRGBToLinear(),
        roughness: 0.42,
        metalness: 0,
        clearcoat: 0.6,
        clearcoatRoughness: 0.12,
        envMapIntensity: 0.55,
      });
      function roundedRect(w, d, r) {
        const s = new THREE.Shape();
        const x = -w / 2,
          y = -d / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + d - r);
        s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
        s.lineTo(x + r, y + d);
        s.quadraticCurveTo(x, y + d, x, y + d - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      // soft contact shadow under each bar
      const cs = document.createElement("canvas");
      cs.width = cs.height = 128;
      const cg = cs.getContext("2d");
      const grd = cg.createRadialGradient(64, 64, 4, 64, 64, 64);
      grd.addColorStop(0, "rgba(40,30,20,0.62)");
      grd.addColorStop(0.45, "rgba(40,30,20,0.25)");
      grd.addColorStop(1, "rgba(40,30,20,0)");
      cg.fillStyle = grd;
      cg.fillRect(0, 0, 128, 128);
      const csTex = new THREE.CanvasTexture(cs);

      const bars = HEIGHTS.map(function (h, i) {
        const geo = new THREE.ExtrudeGeometry(roundedRect(W, W, 0.55), {
          depth: h,
          bevelEnabled: true,
          bevelThickness: 0.28,
          bevelSize: 0.28,
          bevelSegments: 5,
          curveSegments: 10,
        });
        geo.rotateX(-Math.PI / 2);
        const m = new THREE.Mesh(geo, barMat);
        m.castShadow = true;
        m.receiveShadow = true;
        m.position.x = X0 + i * GAP;
        scene.add(m);
        const shadow = new THREE.Mesh(
          new THREE.PlaneGeometry(W * 1.9, W * 1.9),
          new THREE.MeshBasicMaterial({ map: csTex, transparent: true, depthWrite: false, toneMapped: false }),
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.set(X0 + i * GAP, 0.02, 0);
        scene.add(shadow);
        return { m, h, shadow, t0: 0.25 + i * 0.32 };
      });

      // the arrow: glossy ink tube over the bar tops, then it takes off
      const pts = HEIGHTS.map(function (h, i) {
        return new THREE.Vector3(X0 + i * GAP, h + 2.4 + i * 0.15, 0.6);
      });
      pts.unshift(new THREE.Vector3(X0 - 3.5, 1.6, 0.6));
      const last = pts[pts.length - 1];
      pts.push(new THREE.Vector3(last.x + 3.6, last.y + 6, 0.6));
      pts.push(new THREE.Vector3(last.x + 6.5, last.y + 15, 0.6));
      pts.push(new THREE.Vector3(last.x + 8.5, last.y + 26, 0.6));
      const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal");
      const SEG = 480,
        RAD = 14;
      const arrowMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(0x141414).convertSRGBToLinear(), roughness: 0.22, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05 });
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, SEG, 0.34, RAD, false), arrowMat);
      tube.castShadow = true;
      scene.add(tube);
      const head = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.3, 32), arrowMat);
      head.castShadow = true;
      scene.add(head);
      // u where the arrow passes over the last bar
      const U_LAST = 0.7;
      const up = new THREE.Vector3(0, 1, 0);

      function arrowU(t) {
        if (t < 0.95) return 0.0001;
        if (t < 2.95) return lerp(0.0001, U_LAST, inOut2((t - 0.95) / 2.0));
        return lerp(U_LAST, 1, in3(clamp((t - 2.95) / 0.75, 0, 1)) * 0.6 + clamp((t - 2.95) / 0.75, 0, 1) * 0.4);
      }

      const CAM = [
        { t: 0, p: [-14.5, 1.4, 11], l: [-8.5, 2.2, 0] },
        { t: 2.7, p: [-4, 8.5, 38], l: [0.5, 6.5, 0] },
        { t: 3.7, p: [-3, 11.5, 46], l: [0.5, 10.5, 0] },
        { t: 6, p: [-2, 12, 42], l: [1, 11, 0] },
      ];
      function camAt(t) {
        let k = 0;
        while (k < CAM.length - 2 && t > CAM[k + 1].t) k++;
        const a = CAM[k],
          b = CAM[k + 1];
        const u = inOut2(clamp((t - a.t) / (b.t - a.t), 0, 1));
        camera.position.set(lerp(a.p[0], b.p[0], u), lerp(a.p[1], b.p[1], u), lerp(a.p[2], b.p[2], u));
        camera.lookAt(lerp(a.l[0], b.l[0], u), lerp(a.l[1], b.l[1], u), lerp(a.l[2], b.l[2], u));
      }

      function render(t) {
        bars.forEach(function (b) {
          const u = clamp((t - b.t0) / 0.75, 0, 1);
          const e = backOut(u);
          b.m.position.y = -(b.h + 0.7) * (1 - e) + 0.28;
          b.m.visible = u > 0;
          b.shadow.material.opacity = expoOut(u);
        });
        const u = arrowU(t);
        const n = Math.max(1, Math.floor(u * SEG));
        tube.geometry.setDrawRange(0, n * RAD * 6);
        tube.visible = t >= 0.95;
        head.visible = t >= 0.95;
        const p = curve.getPointAt(Math.min(u, 0.9999));
        const tan = curve.getTangentAt(Math.min(u, 0.9999));
        head.position.copy(p).addScaledVector(tan, 0.9);
        head.quaternion.setFromUnitVectors(up, tan);
        camAt(t);
        renderer.render(scene, camera);
      }

      const state = { t: 0 };
      tl.fromTo(
        state,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(state.t);
          },
        },
        0,
      );

      document.querySelectorAll(".vt-w").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 1.15 + i * 0.1);
      });

      // whip out to the next world
      tl.to("#vt-stage", { x: -1500, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 5.7);

      render(0);
      window.__timelines["ventes"] = tl;
    })();
  </script>
</template>
