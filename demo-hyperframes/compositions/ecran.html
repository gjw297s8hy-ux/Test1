  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const SENT = "fais-moi une vidéo qui dépote";

      // composer text: one span per character, then the caret
      const txt = document.getElementById("ec-text");
      for (let i = 0; i < SENT.length; i++) {
        const s = document.createElement("span");
        s.className = "ec-ch";
        s.id = "ec-ch" + i;
        s.textContent = SENT[i];
        txt.appendChild(s);
      }
      const caret = document.createElement("span");
      caret.id = "ec-caret";
      txt.appendChild(caret);

      // AZERTY keyboard, each typed key lights up
      const ROWS = ["azertyuiop", "qsdfghjklm", "^wxcvbn<", "1 >"];
      const kb = document.getElementById("ec-kb");
      const keyEl = {};
      ROWS.forEach(function (r, ri) {
        const row = document.createElement("div");
        row.className = "ec-row";
        for (const ch of r) {
          const k = document.createElement("div");
          k.className = "ec-k";
          if (ri === 3 && ch === " ") {
            k.className += " ec-space";
            k.textContent = "espace";
          } else if ("^<1>".indexOf(ch) >= 0) {
            k.className += " ec-wide";
            k.textContent = { "^": "⇧", "<": "⌫", "1": "123", ">": "↵" }[ch];
          } else k.textContent = ch;
          k.id = "ec-k-" + ri + "-" + r.indexOf(ch);
          keyEl[ch] = k;
          row.appendChild(k);
        }
        kb.appendChild(row);
      });

      // phone arrives from the whip, blurred, and sharpens
      tl.fromTo("#ec-phone-wrap", { x: 900, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);

      // left copy
      document.querySelectorAll("#ec-l1 .ec-w").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 0.4 + i * 0.09);
      });
      tl.to("#ec-l1 .ec-w", { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power3.in", stagger: 0.04 }, 2.95);
      document.querySelectorAll("#ec-l2 .ec-w").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" }, 3.2 + i * 0.1);
      });

      // typing
      const chars = document.querySelectorAll(".ec-ch");
      chars.forEach(function (c, i) {
        tl.set(c, { display: "none" }, 0);
        tl.set(c, { display: "inline" }, 0.5 + i * 0.042);
      });
      for (let i = 0; i < SENT.length; i++) {
        let ch = SENT[i];
        if (ch === "é") ch = "e";
        if (ch === "-") continue;
        const el = keyEl[ch];
        if (!el) continue;
        const t = 0.5 + i * 0.042;
        tl.set(el, { backgroundColor: "#121212", color: "#F1ECE2" }, t);
        tl.set(el, { backgroundColor: ch === " " ? "#FBFAF7" : "#FBFAF7", color: "#121212" }, t + 0.04);
      }
      tl.set("#ec-caret", { opacity: 1 }, 0);
      tl.set("#ec-caret", { opacity: 0 }, 2.95);

      // the attached film: paused on DÉPOTE, then plays once posted
      const frames = ["#ec-f0", "#ec-f1", "#ec-f2", "#ec-f3", "#ec-f4", "#ec-f5"];
      tl.set(frames, { opacity: 0 }, 0);
      tl.set("#ec-f3", { opacity: 1 }, 0);
      let k = 0;
      for (let t = 3.3; t < 7.3; t += 0.25) {
        tl.set(frames, { opacity: 0 }, t);
        tl.set(frames[k % frames.length], { opacity: 1 }, t);
        k++;
      }

      // cursor: in from bottom right, click Publier
      const P = document.getElementById("ec-phone-wrap");
      const BX = 1150 + 16 + 268 + 76,
        BY = 58 + 16 + 84 + 29;
      tl.set("#ec-cursor", { x: 1940, y: 1100 }, 0);
      tl.to("#ec-cursor", { x: BX - 8, y: BY - 6, duration: 0.75, ease: "power3.out" }, 2.1);
      tl.to("#ec-cursor", { scale: 0.86, duration: 0.06, ease: "power2.out", transformOrigin: "10% 5%" }, 2.92);
      tl.to("#ec-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, 2.98);
      tl.to("#ec-btn", { scale: 0.92, duration: 0.06, ease: "power2.out" }, 2.92);
      tl.to("#ec-btn", { scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 2.98);

      // the button morphs into the posted state
      tl.set("#ec-btn", { backgroundColor: "#FF4B1F" }, 0);
      tl.set("#ec-btn", { backgroundColor: "#1F3BFF" }, 2.99);
      tl.fromTo("#ec-btn-t", { opacity: 1 }, { opacity: 0, duration: 0.1 }, 2.98);
      tl.fromTo("#ec-btn-t2", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 3.04);
      tl.fromTo("#ec-cancel", { opacity: 1 }, { opacity: 0, duration: 0.15 }, 3.0);
      tl.set("#ec-ago", { textContent: "brouillon" }, 0);
      tl.set("#ec-ago", { textContent: "à l'instant" }, 3.05);
      // the film widens to the screen edges
      tl.fromTo(
        "#ec-vid",
        { x: 24, y: 10, scale: 400 / 448, borderRadius: 25, transformOrigin: "0% 0%" },
        { x: 0, y: 0, scale: 1, borderRadius: 0, duration: 0.5, ease: "power3.inOut" },
        3.25,
      );
      tl.to("#ec-cursor", { x: 1960, y: 760, duration: 0.6, ease: "power3.in" }, 3.4);
      tl.fromTo("#ec-kb", { y: 0 }, { y: 280, duration: 0.3, ease: "power3.in" }, 3.05);
      tl.fromTo("#ec-meta", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 3.6);
      tl.fromTo("#ec-acts", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 3.7);

      // back for one tap on the film: it opens the next world
      const TX = 1150 + 16 + 224,
        TY = 58 + 16 + 400 + 126;
      tl.to("#ec-cursor", { x: TX - 8, y: TY - 6, duration: 0.7, ease: "power3.out" }, 6.2);
      tl.to("#ec-cursor", { scale: 0.86, duration: 0.06, ease: "power2.out", transformOrigin: "10% 5%" }, 7.0);
      tl.to("#ec-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 7.06);
      tl.fromTo(
        "#ec-iris",
        { clipPath: "circle(0px at " + TX + "px " + TY + "px)" },
        { clipPath: "circle(2300px at " + TX + "px " + TY + "px)", duration: 0.6, ease: "power3.in" },
        7.08,
      );

      window.__timelines["ecran"] = tl;
    })();
  </script>
