<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"color-orange","type":"color","label":"Orange","default":"#FF4B1F"},
    {"id":"color-cobalt","type":"color","label":"Cobalt","default":"#1F3BFF"},
    {"id":"color-paper","type":"color","label":"Paper","default":"#F1ECE2"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#121212"},
    {"id":"font-display","type":"string","label":"Display font","default":"Archivo Black"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-orange: #ff4b1f;
        --color-cobalt: #1f3bff;
        --color-paper: #f1ece2;
        --color-ink: #121212;
        --font-display: "Archivo Black";
        --font-num: "League Gothic";
        --font-body: "Montserrat";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        z-index: 50;
        opacity: 0.14;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="phrase"
        data-composition-id="phrase"
        data-composition-src="compositions/phrase.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="matiere"
        data-composition-id="matiere"
        data-composition-src="compositions/matiere.html"
        data-start="4"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="chiffres"
        data-composition-id="chiffres"
        data-composition-src="compositions/chiffres.html"
        data-start="10"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="ecran"
        data-composition-id="ecran"
        data-composition-src="compositions/ecran.html"
        data-start="16"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="fin"
        data-composition-id="fin"
        data-composition-src="compositions/fin.html"
        data-start="24"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>

      <img
        id="grain"
        class="clip"
        src="assets/grain.png"
        alt=""
        data-start="0"
        data-duration="30"
        data-track-index="2"
        data-layout-ignore
      />

      <!-- AUDIO -->
      <audio id="a-bed" class="clip" src="assets/bed.wav" data-start="0" data-duration="30" data-volume="0.85" data-track-index="10"></audio>
      <audio id="a-imp1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.0" data-duration="0.5" data-volume="0.55" data-track-index="12" data-fade-out="0.15"></audio>
      <audio id="a-imp2" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0.47" data-duration="0.5" data-volume="0.5" data-track-index="13" data-fade-out="0.15"></audio>
      <audio id="a-imp3" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.95" data-duration="0.5" data-volume="0.55" data-track-index="11" data-fade-out="0.15"></audio>
      <audio id="a-imp4" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="1.47" data-duration="1.0" data-volume="0.6" data-track-index="12" data-fade-out="0.5"></audio>
      <audio id="a-stamp" class="clip" src="assets/sfx/click.mp3" data-start="1.95" data-duration="0.37" data-volume="0.9" data-track-index="13"></audio>
      <audio id="a-zoom" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="1.45" data-duration="2.6" data-volume="0.7" data-track-index="11" data-fade-out="0.1"></audio>
      <audio id="a-drop" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.95" data-duration="1.3" data-volume="0.45" data-track-index="12" data-fade-out="0.8"></audio>
      <audio id="a-wave" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.36" data-duration="0.57" data-volume="0.5" data-track-index="13"></audio>
      <audio id="a-dive" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.66" data-duration="0.57" data-volume="0.6" data-track-index="11"></audio>
      <audio id="a-count" class="clip" src="assets/sfx/pop.mp3" data-start="11.33" data-duration="0.72" data-volume="0.6" data-track-index="12"></audio>
      <audio id="a-bar0" class="clip" src="assets/sfx/pop.mp3" data-start="12.29" data-duration="0.6" data-volume="0.45" data-track-index="13"></audio>
      <audio id="a-bar1" class="clip" src="assets/sfx/pop.mp3" data-start="12.71" data-duration="0.6" data-volume="0.45" data-track-index="11"></audio>
      <audio id="a-bar2" class="clip" src="assets/sfx/ping.mp3" data-start="12.94" data-duration="1.0" data-volume="1.0" data-track-index="12" data-fade-out="0.3"></audio>
      <audio id="a-bar3" class="clip" src="assets/sfx/pop.mp3" data-start="13.55" data-duration="0.6" data-volume="0.45" data-track-index="13"></audio>
      <audio id="a-bar4" class="clip" src="assets/sfx/pop.mp3" data-start="13.97" data-duration="0.6" data-volume="0.45" data-track-index="11"></audio>
      <audio id="a-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="15.71" data-duration="0.57" data-volume="0.6" data-track-index="12"></audio>
      <audio id="a-type" class="clip" src="assets/sfx/typing.mp3" data-start="16.05" data-duration="1.5" data-volume="0.6" data-track-index="13" data-fade-out="0.1"></audio>
      <audio id="a-click1" class="clip" src="assets/sfx/click.mp3" data-start="18.87" data-duration="0.37" data-volume="0.85" data-track-index="11"></audio>
      <audio id="a-post" class="clip" src="assets/sfx/pop.mp3" data-start="19.58" data-duration="0.72" data-volume="0.45" data-track-index="12"></audio>
      <audio id="a-click2" class="clip" src="assets/sfx/click.mp3" data-start="22.95" data-duration="0.37" data-volume="0.85" data-track-index="13"></audio>
      <audio id="a-iris" class="clip" src="assets/sfx/whoosh.mp3" data-start="23.26" data-duration="0.57" data-volume="0.6" data-track-index="11"></audio>
      <audio id="a-rise" class="clip" src="assets/sfx/riser.mp3" data-start="24.4" data-duration="2.15" data-volume="0.6" data-track-index="12" data-media-start="0.9" data-fade-out="0.05"></audio>
      <audio id="a-lock" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="26.47" data-duration="2.0" data-volume="0.6" data-track-index="13" data-fade-out="1.2"></audio>
      <audio id="a-type2" class="clip" src="assets/sfx/typing.mp3" data-start="26.75" data-duration="1.1" data-volume="0.45" data-track-index="11" data-fade-out="0.1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
